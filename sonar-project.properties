# Configuração do SonarQube Scanner
# Reproduz o padrão usado pela Senior: projectKey, tags, exclusions

sonar.projectKey=poc-erp-gestao-pessoas
sonar.projectName=POC ERP Gestao de Pessoas
sonar.projectVersion=1.0.0

# Tags para identificar linha de produto e módulo (como a Senior faz)
sonar.projectTags=erp,poc,gestao-pessoas

# Diretório de código fonte
sonar.sources=src
sonar.tests=tests

# Exclusões (padrão Senior: excluir node_modules, coverage, etc)
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js,**/tests/**

# Cobertura de testes (lcov gerado pelo Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Configuração do servidor (será sobrescrita na pipeline)
sonar.host.url=http://localhost:9000
sonar.login=
