version: 0.0
os: linux
files:
  - source: /
    destination: /opt/app
    overwrite: true
permissions:
  - object: /opt/app
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - directory
      - file
hooks:
  BeforeInstall:
    - location: scripts/codedeploy/before-install.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/codedeploy/after-install.sh
      timeout: 120
      runas: root
  ApplicationStart:
    - location: scripts/codedeploy/start-app.sh
      timeout: 30
      runas: root
  ApplicationStop:
    - location: scripts/codedeploy/stop-app.sh
      timeout: 30
      runas: root
