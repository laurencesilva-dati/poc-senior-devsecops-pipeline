# AWS CodeBuild - Pipeline DevSecOps
# Reproduz o fluxo da Senior: Push → Scan → Quality Gate → Feedback
# Stages: Security Scan (SAST + SCA + Secrets + IaC) → Quality Gate → Build & Test

version: 0.2

env:
  variables:
    SONAR_HOST_URL: "http://52.207.212.75:9000"
    SONAR_PROJECT_KEY: "poc-erp-gestao-pessoas"
    SONAR_PROJECT_NAME: "POC ERP Gestao de Pessoas"
  secrets-manager:
    SONAR_TOKEN: "poc-devsecops/sonarqube:token"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== STAGE 0 - INSTALL TOOLS ==="
      - npm ci
      # Instalar SonarQube Scanner
      - export SONAR_SCANNER_VERSION=5.0.1.3006
      - curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux.zip
      - unzip -q sonar-scanner.zip
      - export PATH=$PATH:$(pwd)/sonar-scanner-${SONAR_SCANNER_VERSION}-linux/bin
      # Instalar Trivy (SCA + Container + IaC scan)
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      # Instalar TruffleHog (Secret detection)
      - curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

  pre_build:
    commands:
      - echo "=== STAGE 1 - SECURITY SCANS ==="
      - echo "--- 1.1 SAST (SonarQube) ---"
      - sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.projectName="$SONAR_PROJECT_NAME" -Dsonar.sources=src -Dsonar.tests=tests -Dsonar.exclusions="**/node_modules/**,**/coverage/**" -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info -Dsonar.sourceEncoding=UTF-8
      - echo "--- 1.2 SCA - Software Composition Analysis (Trivy) ---"
      - trivy fs --severity HIGH,CRITICAL --format json --output trivy-sca-report.json . || true
      - echo "--- 1.3 Secret Detection (TruffleHog) ---"
      - trufflehog filesystem --directory=. --only-verified --json > trufflehog-report.json 2>/dev/null || true
      - echo "--- 1.4 IaC Scan (Trivy) ---"
      - trivy config --severity HIGH,CRITICAL --format json --output trivy-iac-report.json ./infra || true

  build:
    commands:
      - echo "=== STAGE 2 - UNIT TESTS + COVERAGE ==="
      - npm run test:ci
      - echo "=== STAGE 3 - QUALITY GATE CHECK ==="
      - echo "Aguardando processamento do SonarQube..."
      - sleep 15
      - "QG_STATUS=$(curl -s -u $SONAR_TOKEN: $SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY | python3 -c \"import sys,json; print(json.load(sys.stdin)['projectStatus']['status'])\" 2>/dev/null || echo 'OK')"
      - echo "Quality Gate Status: $QG_STATUS"
      - if [ "$QG_STATUS" = "ERROR" ]; then echo "QUALITY GATE FAILED"; exit 1; fi
      - echo "Quality Gate PASSED"

  post_build:
    commands:
      - echo "=== STAGE 4 - DEPLOY (se Quality Gate passou) ==="
      - echo "Build concluído com sucesso. Artefatos prontos para deploy."

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - node_modules/**
    - coverage/**
    - .scannerwork/**

reports:
  coverage:
    files:
      - coverage/lcov.info
    file-format: SIMPLECOV
