version: 0.2

env:
  variables:
    SONAR_HOST_URL: "http://54.88.165.143:9000"
    SONAR_PROJECT_KEY: "poc-erp-gestao-pessoas"
    # SONAR_TOKEN configurado no CodeBuild project (environment variable)

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== INSTALL TOOLS ==="
      - npm ci
      - export SONAR_SCANNER_VERSION=5.0.1.3006
      - curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux.zip
      - unzip -q sonar-scanner.zip
      - export PATH=$PATH:$(pwd)/sonar-scanner-${SONAR_SCANNER_VERSION}-linux/bin
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

  pre_build:
    commands:
      - echo "=== SAST - SonarQube ==="
      - sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.sources=src -Dsonar.tests=tests -Dsonar.exclusions=**/node_modules/**,**/coverage/** -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info -Dsonar.sourceEncoding=UTF-8
      - echo "=== SCA - Trivy ==="
      - trivy fs --severity HIGH,CRITICAL --exit-code 0 . || true
      - echo "=== Secret Detection ==="
      - trufflehog filesystem --directory=. --only-verified 2>/dev/null || true
      - echo "=== IaC Scan ==="
      - trivy config --severity HIGH,CRITICAL ./infra || true

  build:
    commands:
      - echo "=== UNIT TESTS ==="
      - npm run test:ci
      - echo "=== QUALITY GATE ==="
      - sleep 15
      - curl -s -u $SONAR_TOKEN:'' $SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY > qg.json
      - cat qg.json
      - python3 -c 'import json; d=json.load(open("qg.json")); s=d.get("projectStatus",{}).get("status","OK"); print(f"QG={s}"); exit(1 if s=="ERROR" else 0)'

  post_build:
    commands:
      - echo "Pipeline DevSecOps concluida com sucesso"

artifacts:
  files:
    - "**/*"
  exclude-paths:
    - node_modules/**
    - coverage/**
    - .scannerwork/**
