version: 0.2

env:
  variables:
    SONAR_HOST_URL: "http://54.88.165.143:9000"
    SONAR_PROJECT_KEY: "poc-erp-gestao-pessoas"
    SONAR_PROJECT_NAME: "POC ERP Gestao de Pessoas"
  secrets-manager:
    SONAR_TOKEN: "poc-devsecops/sonarqube:token"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== INSTALL TOOLS ==="
      - npm ci
      - export SONAR_SCANNER_VERSION=5.0.1.3006
      - curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux.zip
      - unzip -q sonar-scanner.zip
      - export PATH=$PATH:$(pwd)/sonar-scanner-${SONAR_SCANNER_VERSION}-linux/bin
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

  pre_build:
    commands:
      - echo "=== SAST - SonarQube Scanner ==="
      - sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.sources=src -Dsonar.tests=tests -Dsonar.exclusions=**/node_modules/**,**/coverage/** -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info -Dsonar.sourceEncoding=UTF-8
      - echo "=== SCA - Trivy ==="
      - trivy fs --severity HIGH,CRITICAL --exit-code 0 . || true
      - echo "=== Secret Detection - TruffleHog ==="
      - trufflehog filesystem --directory=. --only-verified 2>/dev/null || true
      - echo "=== IaC Scan - Trivy ==="
      - trivy config --severity HIGH,CRITICAL ./infra || true

  build:
    commands:
      - echo "=== UNIT TESTS + COVERAGE ==="
      - npm run test:ci
      - echo "=== QUALITY GATE CHECK ==="
      - sleep 15
      - curl -s -u $SONAR_TOKEN:'' $SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY > qg_result.json
      - cat qg_result.json
      - QG_STATUS=$(cat qg_result.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('projectStatus',{}).get('status','OK'))" 2>/dev/null || echo OK)
      - echo "Quality Gate Status = $QG_STATUS"

  post_build:
    commands:
      - echo "Build concluido. Artefatos prontos para deploy."

artifacts:
  files:
    - "**/*"
  exclude-paths:
    - node_modules/**
    - coverage/**
    - .scannerwork/**
