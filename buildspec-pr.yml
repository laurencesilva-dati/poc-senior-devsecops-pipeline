version: 0.2

# Pipeline de PR: consulta API do SonarQube e reporta status no GitHub
# NAO faz scan - apenas verifica se o projeto esta em conformidade
# Trigada por PR para staging ou prod

env:
  variables:
    SONAR_HOST_URL: "http://54.88.165.143:9000"
    SONAR_PROJECT_KEY: "poc-erp-gestao-pessoas"
    GITHUB_REPO: "laurencesilva-dati/poc-senior-devsecops-pipeline"
    # SONAR_TOKEN e GITHUB_TOKEN configurados no CodeBuild project

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== PR VALIDATION - Consulta Quality Gate ==="

  build:
    commands:
      - COMMIT_SHA=${CODEBUILD_RESOLVED_SOURCE_VERSION}
      - echo "Commit = $COMMIT_SHA"
      - |
        curl -s -X POST \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/$GITHUB_REPO/statuses/$COMMIT_SHA" \
          -d '{"state":"pending","context":"sonarqube-quality-gate","description":"Verificando Quality Gate..."}'
      - echo "Consultando metricas do SonarQube..."
      - curl -s -u $SONAR_TOKEN:'' "$SONAR_HOST_URL/api/measures/component?component=$SONAR_PROJECT_KEY&metricKeys=coverage,duplicated_lines_density,vulnerabilities,security_hotspots,security_hotspots_reviewed,security_rating" > metrics.json
      - cat metrics.json
      - |
        python3 << 'PYEOF'
        import json, sys

        with open('metrics.json') as f:
            data = json.load(f)

        measures = {m['metric']: m.get('value', '0') for m in data.get('component', {}).get('measures', [])}
        print(f"\nMetricas do projeto:")
        for k, v in measures.items():
            print(f"  {k}: {v}")

        failures = []

        coverage = float(measures.get('coverage', '0'))
        if coverage < 80:
            failures.append(f"Coverage {coverage}% < 80%")

        dup = float(measures.get('duplicated_lines_density', '0'))
        if dup > 3:
            failures.append(f"Duplicated lines {dup}% > 3%")

        vulns = int(measures.get('vulnerabilities', '0'))
        if vulns > 0:
            failures.append(f"Vulnerabilities: {vulns}")

        hotspots = int(measures.get('security_hotspots', '0'))
        reviewed = float(measures.get('security_hotspots_reviewed', '0'))
        if hotspots > 0 and reviewed < 100:
            failures.append(f"Security Hotspots: {hotspots} nao revisados ({reviewed}% reviewed)")

        sec_rating = float(measures.get('security_rating', '1'))
        if sec_rating > 1:
            failures.append(f"Security Rating: {int(sec_rating)} (deve ser A=1)")

        if failures:
            print(f"\n{'='*50}")
            print("QUALITY GATE: FAILED")
            print(f"{'='*50}")
            for f in failures:
                print(f"  X {f}")
            print(f"\nMerge BLOQUEADO. Corrija os problemas e faca novo push em dev.")
            with open('qg_result.txt', 'w') as out:
                out.write('FAILED')
        else:
            print(f"\n{'='*50}")
            print("QUALITY GATE: PASSED")
            print(f"{'='*50}")
            print("Merge LIBERADO.")
            with open('qg_result.txt', 'w') as out:
                out.write('PASSED')
        PYEOF

  post_build:
    commands:
      - QG_RESULT=$(cat qg_result.txt 2>/dev/null || echo PASSED)
      - |
        if [ "$QG_RESULT" = "FAILED" ]; then
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GITHUB_REPO/statuses/$COMMIT_SHA" \
            -d '{"state":"failure","context":"sonarqube-quality-gate","description":"Quality Gate FAILED - corrija o codigo em dev","target_url":"'"$SONAR_HOST_URL/dashboard?id=$SONAR_PROJECT_KEY"'"}'
          exit 1
        else
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GITHUB_REPO/statuses/$COMMIT_SHA" \
            -d '{"state":"success","context":"sonarqube-quality-gate","description":"Quality Gate PASSED - merge liberado","target_url":"'"$SONAR_HOST_URL/dashboard?id=$SONAR_PROJECT_KEY"'"}'
        fi
